[project]
name = "hcd-sync"
version = "0.1.0"
description = "Sync pipeline for the searchable Coronel Rosales HCD ordinance archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pymupdf>=1.24",
]

[project.scripts]
hcd-sync = "hcd_sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.23",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcd_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true
